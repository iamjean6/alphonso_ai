services:
  server:
    build:
      context: .
    ports:
      - 8000:8000
    env_file:
      - .env
      - adk_agent/.env
    environment:
      - KAFKA_BROKER=kafka:29092
      - REDIS=${REDIS:-redis://redis:6379}
    depends_on:
      - kafka

  worker:
    build:
      context: .
    env_file:
      - .env
      - adk_agent/.env
    environment:
      - KAFKA_BROKER=kafka:29092
      - REDIS=${REDIS:-redis://redis:6379}
    command: python worker.py
    depends_on:
      - kafka

  kafka:
    image: apache/kafka:latest
    container_name: alphonso_kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      # KRaft configuration (No Zookeeper required)
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      # Dual Listeners: 29092 for internal Docker network, 9092 for external host (Node.js)
      - KAFKA_LISTENERS=PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,EXTERNAL://${KAFKA_HOST:-localhost}:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  kafka_data:
    driver: local
